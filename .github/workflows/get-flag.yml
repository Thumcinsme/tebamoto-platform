name: get-flag
on: [workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  get-flag:
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: Debug OIDC token subject
        run: |
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${TOKEN_URL}" | jq -r '.value')

          echo "=== OIDC Token Claims ==="
          echo "${OIDC_TOKEN}" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq .

          echo "=== Subject claim only ==="
          echo "${OIDC_TOKEN}" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq -r '.sub'
